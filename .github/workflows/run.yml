name: stock_scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WEBHOOK_URL: ${{secrets.WEBHOOK_URL}}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install
        run: pip install yfinance requests

      - name: Run Script
        run: python main.py